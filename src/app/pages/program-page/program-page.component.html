@if (viewModel$ | async; as vm) {
  @if (vm.isLoading) {
    <main class="flex min-h-screen items-center justify-center bg-almanac-ink px-5 text-white">
      <section class="flex max-w-xl flex-col gap-5 text-center">
        <p class="eyebrow text-almanac-gold">Загрузка</p>
        <h1 class="font-display text-5xl font-semibold">Подготавливаем программу</h1>
      </section>
    </main>
  } @else if (vm.guest) {
    <app-invite-page-shell [guest]="vm.guest" [content]="content">
      <app-program-section [content]="content"></app-program-section>
    </app-invite-page-shell>
  }
}
