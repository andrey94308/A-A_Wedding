<section class="overflow-hidden bg-almanac-ink">
  <img
    class="h-dvh w-full object-cover"
    [src]="content.heroImage"
    alt="Приглашение Anna and Andrey"
  />
</section>

<section class="relative flex flex-col justify-center overflow-hidden bg-almanac-ink text-white">
  <div class="absolute inset-0">
    <img
      class="h-full w-full object-cover"
      [src]="content.mainImage"
      alt="Анна и Андрей"
    />
    <div class="absolute inset-0 bg-gradient-to-t from-almanac-ink/72 via-almanac-ink/20 to-transparent"></div>
  </div>

  <div class="relative mx-auto flex w-full max-w-6xl translate-y-6 justify-center px-7 py-8 md:-translate-y-20 md:px-8 md:py-10">
    <div class="flex w-full max-w-[24rem] flex-col items-center gap-20 sm:max-w-2xl">
      <div class="flex flex-col items-center gap-5">
        <p class="text-center text-3xl leading-10 text-almanac-cocoa md:text-4xl md:leading-[3.1rem]">
          {{ greeting }} {{ guest.firstName }}, мы будем очень рады разделить этот день вместе в Вене!
        </p>
      </div>
      <app-invite-tabs [uuid]="guest.uuid" variant="landing"></app-invite-tabs>
    </div>
  </div>

  <footer class="absolute inset-x-0 bottom-0 bg-almanac-ink px-5 py-5 md:px-8">
    <div class="mx-auto flex max-w-6xl flex-col gap-1">
      <p class="text-sm font-semibold uppercase tracking-[0.22em] text-almanac-silver md:text-base">{{ content.venueName }}</p>
    </div>
  </footer>
</section>
