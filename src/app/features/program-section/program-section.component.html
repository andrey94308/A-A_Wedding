<div id="program">
  <app-section-shell
    eyebrow="Program"
    title="Wedding day"
    intro="The timeline may still receive small updates closer to the date."
  >
    <div class="grid gap-3">
      @for (item of content.program; track item.time + item.title) {
        <article class="grid gap-4 border-t border-almanac-ink/15 py-6 md:grid-cols-[10rem_1fr_11rem] md:items-start">
          <time class="font-display text-3xl font-semibold text-almanac-plum">{{ item.time }}</time>
          <div class="flex flex-col gap-2">
            <h3 class="text-xl font-semibold">{{ item.title }}</h3>
            <p class="leading-7 text-almanac-ink/70">{{ item.details }}</p>
          </div>
          <p class="text-sm font-semibold uppercase tracking-[0.16em] text-almanac-gold">{{ item.room }}</p>
        </article>
      }
    </div>
  </app-section-shell>
</div>
