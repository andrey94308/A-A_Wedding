<div id="program">
  <app-section-shell
    eyebrow="Программа"
  >
    <div class="flex flex-col gap-4">
      @for (item of content.program; track item.time + item.title; let index = $index) {
        <article class="overflow-hidden rounded-lg border border-almanac-ink/12 bg-white/70 shadow-soft">
          <button
            class="focus-ring grid w-full gap-1 px-5 py-5 text-left md:grid-cols-[10rem_1fr_11rem] md:items-center md:px-7"
            type="button"
            [attr.aria-expanded]="expandedIndex === index"
            (click)="toggle(index)"
          >
            <time class="font-display text-3xl font-semibold text-almanac-plum">{{ item.time }}</time>
            <span class="flex flex-col gap-2">
              @if(expandedIndex !== index) {
                <span class="text-xl font-semibold">{{ item.title }}</span>
              }
              <span class="text-sm leading-6 text-almanac-ink/62">{{ expandedIndex === index ? 'Свернуть детали' : 'Нажмите, чтобы раскрыть детали' }}</span>
            </span>
            <span class="text-sm font-semibold uppercase tracking-[0.16em] text-almanac-gold">{{ item.room }}</span>
          </button>

          @if (expandedIndex === index) {
            <div class="overflow-hidden bg-almanac-parchment">
              <div class="relative aspect-[4/3] overflow-hidden md:aspect-[3/2]">
                <img class="absolute inset-0 h-full w-full object-cover" [src]="item.image" [alt]="item.title" />
                <div class="absolute inset-0 bg-gradient-to-t from-almanac-ink/72 via-almanac-ink/18 to-transparent"></div>
                <div class="absolute inset-x-0 bottom-0 h-28 bg-gradient-to-b from-transparent via-almanac-parchment/72 to-almanac-parchment backdrop-blur-[1px]"></div>

                <div class="relative flex h-full items-end p-5 text-almanac-ink/70 md:p-8">
                  <h3 class="max-w-3xl font-display text-3xl font-semibold leading-tight md:text-7xl">
                    {{ item.title }}
                  </h3>
                </div>
              </div>

              <div class="px-5 pb-7 pt-2 md:px-8 md:pb-9 md:pt-3">
                <p class="max-w-3xl whitespace-pre-line text-lg leading-8 text-almanac-ink/76 md:text-xl">
                  {{ item.details }}
                </p>
              </div>
            </div>
          }
        </article>
      }
    </div>
  </app-section-shell>
</div>
